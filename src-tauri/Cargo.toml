[package]
name = "supercode"
version = "0.1.5"
description = "A lightweight desktop workspace for coding agents"
edition = "2021"

[lib]
name = "supercode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
toml = "0.8"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
similar = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-registry = "0.6"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "UI_Notifications"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.supercode]
codegen-units = 16
