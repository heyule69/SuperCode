name: Windows verification
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache pinned cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .supercode/tools/bin/cargo-audit.exe
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install pinned cargo-audit
        id: install-audit
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.supercode/tools/bin/cargo-audit.exe')) {
            cargo install --locked --version 0.22.2 --root .supercode/tools cargo-audit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $auditVersion = & '.supercode/tools/bin/cargo-audit.exe' audit --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $auditVersion
          if ($auditVersion -notmatch '\b0\.22\.2\b') { throw 'Unexpected cached cargo-audit version' }
      - name: Audit application Cargo.lock
        shell: pwsh
        run: |
          & '.supercode/tools/bin/cargo-audit.exe' audit --file src-tauri/Cargo.lock --db .supercode/tools/advisory-db --url https://github.com/RustSec/advisory-db.git --color never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit installer Cargo.lock
        if: ${{ !cancelled() && steps.install-audit.outcome == 'success' }}
        shell: pwsh
        run: |
          & '.supercode/tools/bin/cargo-audit.exe' audit --file installer/Cargo.lock --db .supercode/tools/advisory-db --no-fetch --color never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci --ignore-scripts
      - run: npm run check:encoding
      - run: npm run check:catalogs
      - run: npm run build
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path installer/Cargo.toml --target-dir src-tauri/target
      - run: npm run release:test
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-benchmark
          path: .supercode/benchmarks/conversation.json
          retention-days: 14
      - run: npm audit --registry=https://registry.npmjs.org
