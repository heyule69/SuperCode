<!doctype html>
<html lang="zh-CN" data-theme="dark" data-phase="welcome">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>SuperCode · 安装器动效预览</title>
  <link id="favicon" rel="icon" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --page: #111214; --surface: #1b1c1f; --text: #d5d4d2;
      --muted: #88898d; --line: #ffffff10; --hover: #ffffff09;
      --field: #17181a; --accent: #fb8b51; --focus: #fb8b5180;
      --bloom: 0; --surface-shadow: 0 28px 90px #00000032;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #eeede9; --surface: #f9f8f4; --text: #34332f;
      --muted: #77756f; --line: #31271912; --hover: #31271908;
      --field: #f0eee9; --accent: #dc6930; --focus: #dc693080;
      --surface-shadow: 0 28px 90px #52452713;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; height: 100dvh; display: grid; place-items: center; padding: 28px; background: var(--page); color: var(--text); }
    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid var(--focus); outline-offset: 5px; }
    [hidden] { display: none !important; }
    .installer {
      position: relative; display: flex; flex-direction: column;
      width: min(100%, 700px); height: min(574px, calc(100dvh - 56px)); overflow: hidden;
      border-radius: 20px; border: 1px solid var(--line); background: var(--surface);
      box-shadow: var(--surface-shadow); isolation: isolate;
    }
    .installer::before {
      content: ""; position: absolute; inset: 7% 7% 18%; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 58%, #e56b2410 0%, transparent 63%);
      opacity: var(--bloom);
    }
    .top-controls { position: absolute; top: 15px; right: 16px; z-index: 2; display: flex; gap: 2px; }
    .quiet-button { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); transition: color 180ms, background 180ms; }
    .quiet-button:hover { background: var(--hover); color: var(--text); }
    .quiet-button svg { width: 16px; height: 16px; }
    .stage { position: relative; flex: 1; min-height: 0; width: 100%; margin-top: 28px; }
    canvas { display: block; width: 100%; height: 100%; cursor: default; touch-action: manipulation; outline: none; }
    [data-phase="welcome"] #mark { animation: standby 5s ease-in-out infinite; }
    [data-phase="complete"] #mark { animation: settled 700ms cubic-bezier(.2,.75,.25,1) both; }
    .progress-readout { position: absolute; top: calc(50% + 8px); left: 50%; transform: translate(-50%, -50%); pointer-events: none; color: var(--muted); font: 500 11px/1 Consolas, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
    .directory { flex-shrink: 0; margin: 5px 40px 30px; }
    .directory > label { display: block; margin: 0 0 10px 2px; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .1px; }
    .directory-row { display: flex; align-items: center; gap: 14px; }
    .directory-field { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; height: 48px; border: 1px solid var(--line); border-radius: 9px; background: var(--field); padding: 0 14px; transition: border-color 180ms, box-shadow 180ms; }
    .directory-field:focus-within { border-color: var(--focus); box-shadow: 0 0 0 2px #eb7b3110; }
    .directory-field:has(input[aria-invalid="true"]) { border-color: #e66d45; }
    .directory-field > svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
    input { min-width: 0; width: 100%; border: 0; outline: 0; padding: 0; color: var(--text); background: transparent; font-family: Consolas, "Segoe UI", monospace; font-size: 12px; }
    input:disabled { opacity: .6; -webkit-text-fill-color: var(--text); cursor: default; }
    .action { display: grid; place-items: center; width: 48px; height: 48px; flex-shrink: 0; border: 0; border-radius: 50%; color: #281a12; background: var(--accent); transition: transform 180ms, box-shadow 180ms; }
    .action:hover { transform: translateY(-1px); box-shadow: 0 5px 18px #dd682326; }
    .action:active { transform: scale(.94); }
    .action svg { width: 19px; height: 19px; }
    .action:disabled { cursor: default; opacity: .5; }
    [data-state="launch-preview"] .action { background: #b4c3a2; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .installer { height: min(574px, calc(100dvh - 32px)); border-radius: 16px; }
      .top-controls { top: 8px; right: 8px; }
      .stage { margin-top: 30px; }
      .directory { margin: 0 22px 24px; }
      .directory-row { gap: 10px; }
      .directory-field { padding: 0 11px; gap: 8px; }
      input { font-size: 11px; }
      .action { width: 46px; height: 46px; }
    }
    @keyframes standby { 0%,100% { transform: translateY(1px) scale(1); } 50% { transform: translateY(-3px) scale(1.012); } }
    @keyframes settled { 0% { transform: scale(.985); } 45% { transform: scale(1.025); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      button, .directory-field { transition: none !important; }
      .action:hover, .action:active { transform: none; }
      #mark { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="installer" aria-label="SuperCode 安装器动画设计预览">
    <div class="top-controls">
      <button class="quiet-button" id="replay" aria-label="返回安装前预览" title="返回安装前">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.8 7M4 4v6h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="stage" id="stage">
      <canvas id="mark" role="img" aria-label="SuperCode 透明徽记"><img id="fallback" alt="SuperCode 透明徽记"></canvas>
      <span class="progress-readout" id="progress-readout" aria-hidden="true" hidden>0%</span>
    </div>
    <div class="directory">
      <label for="install-path">安装目录</label>
      <div class="directory-row">
        <div class="directory-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3V7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <input id="install-path" value="%LOCALAPPDATA%\SuperCode" aria-label="安装目录" autocomplete="off" spellcheck="false">
        </div>
        <button class="action" id="action" aria-label="开始安装预览" title="开始安装" disabled>
          <svg id="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 18v2h14v-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <span class="sr-only" id="status" role="status" aria-live="polite"></span>
    <span class="sr-only" id="progress" role="progressbar" aria-label="安装预览进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden></span>
  </main>

            const texture = document.createElement('canvas');
            const density = 1.8;
            texture.width = Math.ceil(width * density); texture.height = Math.ceil(height * density);
            const painter = texture.getContext('2d', { alpha: true });
            painter.scale(density, density); painter.translate(-x, -y);
            painter.beginPath();
            painter.arc(0, 0, outer, low, high);
            if (inner) painter.arc(0, 0, inner, high, low, true);
            else painter.lineTo(0, 0);
            painter.closePath(); painter.clip();
            painter.drawImage(image, -center.x * sourceScale, -center.y * sourceScale, image.naturalWidth * sourceScale, image.naturalHeight * sourceScale);
            const index = petal * 5 + band;
            pieces.push({ texture, x: x + width / 2, y: y + height / 2, width, height, angle,
              arrival: .02 + petal * .084 + band * .017,
              distance: 105 + band * 10 + random(index + 1) * 85,
              tangent: (random(index + 2) - .5) * 145,
              turn: (random(index + 3) - .5) * 6.4,
              fold: 1.0 + random(index + 4) * .75,
              seed: random(index + 5),
            });
          }
        }
      };

      const draw = () => {
        if (!ready || !size.width || !size.height || destroyed) return;
        const { width, height, pixelRatio } = size;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.clearRect(0, 0, width, height);
        const scale = Math.min(width / 700, height / 454);
        const readout = element('progress-readout');
        readout.textContent = `${percentage()}%`;
        readout.style.fontSize = `${Math.max(8, Math.min(11, 11 * scale))}px`;
        readout.style.transform = `translate(-50%, -50%) translate(${reducedMotion ? 0 : pointer.x * 6}px, ${reducedMotion ? 0 : pointer.y * 5}px)`;
        context.save();
        context.translate(width / 2 + (reducedMotion ? 0 : pointer.x * 6), height / 2 + 8 + (reducedMotion ? 0 : pointer.y * 5));
        context.scale(scale, scale);
        const finish = clamp((progress - .88) / .12);
        const bloom = reducedMotion ? 0 : Math.sin(finish * Math.PI) * (1 - finish) * 23;
        root.style.setProperty('--bloom', String(phase === 'welcome' ? .2 : phase === 'complete' ? .7 : .3 + Math.sin(progress * Math.PI) * .7));
        if (phase !== 'installing' || progress >= 1) {
          context.drawImage(image, -center.x * sourceScale, -center.y * sourceScale, image.naturalWidth * sourceScale, image.naturalHeight * sourceScale);
        } else {
          for (const piece of pieces) {
            const local = clamp((progress - piece.arrival) / .19);
            if (local <= 0) continue;
            const landed = ease(local), remaining = 1 - landed;
            const tangent = piece.tangent * remaining + Math.sin(local * Math.PI) * 20;
            const radial = piece.distance * remaining + bloom;
            const wobble = local > .76 ? Math.sin((local - .76) / .24 * Math.PI) * 2.2 * (1 - local) : 0;
            const x = piece.x + (reducedMotion ? 0 : Math.cos(piece.angle) * (radial + wobble) - Math.sin(piece.angle) * tangent);
            const y = piece.y + (reducedMotion ? 0 : Math.sin(piece.angle) * (radial + wobble) + Math.cos(piece.angle) * tangent);
            const opacity = reducedMotion ? smooth(clamp(local * 2)) : smooth(clamp(local * 4.5));
            if (!reducedMotion && local < .74) {
              const sparks = Math.sin(local / .74 * Math.PI) * .28;
              for (let tail = 1; tail <= 3; tail++) {
                const offset = tail * 8 * remaining;
                context.globalAlpha = sparks / tail;
                context.fillStyle = '#ff9b58';
                context.beginPath();
                context.arc(x + Math.cos(piece.angle) * offset, y + Math.sin(piece.angle) * offset, 1.05 + piece.seed, 0, Math.PI * 2);
                context.fill();
              }
            }
            context.save();
            context.globalAlpha = opacity;
            context.translate(x, y);
            if (!reducedMotion) {
              context.rotate(piece.turn * remaining + Math.sin(finish * Math.PI) * .08);
              const fold = .16 + .84 * Math.abs(Math.cos((1 - local) * Math.PI * piece.fold));
              context.scale(.65 + .35 * landed, mix(fold, 1, smooth(local)));
            }
            context.drawImage(piece.texture, -piece.width / 2, -piece.height / 2, piece.width, piece.height);
            context.restore();
          }
        }
        context.restore(); context.globalAlpha = 1;
        element('progress').setAttribute('aria-valuenow', String(percentage()));
      };

      const resize = () => {
        const rectangle = stage.getBoundingClientRect();
        size.width = rectangle.width; size.height = rectangle.height; size.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(size.width * size.pixelRatio); canvas.height = Math.round(size.height * size.pixelRatio);
        draw();
      };
      const stopFrame = () => { if (frame !== null) cancelAnimationFrame(frame); frame = null; };
      const pause = () => {
        if (state !== 'playing') return;
        elapsed = Math.min(duration, performance.now() - startTime); progress = elapsed / duration;
        state = 'paused'; stopFrame(); updateControls(); draw();
      };
      const tick = () => {
        frame = null;
        if (state !== 'playing' || destroyed) return;
        elapsed = Math.min(duration, performance.now() - startTime); progress = elapsed / duration;
        draw();
        if (progress >= 1) { phase = 'complete'; state = 'complete'; updateControls(); element('status').textContent = '安装完成效果预览。'; }
        else frame = requestAnimationFrame(tick);
      };
      const resume = () => {
        if (!ready || destroyed || phase !== 'installing' || state === 'playing' || progress >= 1) return;
        state = 'playing'; startTime = performance.now() - elapsed; updateControls();
        if (!document.hidden) frame = requestAnimationFrame(tick);
        else { state = 'paused'; restorePlayback = true; updateControls(); }
      };
      const validatePath = () => {
        const path = element('install-path').value.trim();
        const valid = /^(?:[a-z]:[\\/]|\\\\[^\\]+\\[^\\]+[\\/]|%LOCALAPPDATA%[\\/])/i.test(path) && !/[<>"|?*\u0000-\u001f]/.test(path);
        element('install-path').setAttribute('aria-invalid', String(!valid));
        element('install-path').title = valid ? '' : '请输入 Windows 绝对路径';
        if (!valid) element('install-path').focus();
        return valid;
      };
      const reset = () => {
        if (!ready || destroyed) return false;
        stopFrame(); restorePlayback = false; elapsed = 0; progress = 0; installationPath = '';
        pointer.x = 0; pointer.y = 0; phase = 'welcome'; state = 'idle';
        element('status').textContent = ''; updateControls(); draw(); return true;
      };
      const startPreview = () => {
        if (!ready || destroyed || !validatePath()) return;
        stopFrame(); restorePlayback = false; elapsed = 0; progress = 0;
        installationPath = element('install-path').value.trim(); pointer.x = 0; pointer.y = 0;
        phase = 'installing'; state = 'paused';
        element('status').textContent = '正在展示安装动画。'; updateControls(); draw(); resume();
      };
      const launchPreview = () => {
        if (!ready || destroyed || phase !== 'complete') return;
        state = 'launch-preview'; updateControls();
        element('status').textContent = '启动入口仅为设计演示，未启动真实软件。';
        window.dispatchEvent(new CustomEvent('supercode-launch-preview', { detail: { installationPath } }));
      };
      const act = () => {
        if (phase === 'welcome') startPreview();
        else if (phase === 'complete') launchPreview();
        else if (state === 'playing') pause();
        else if (state === 'paused') resume();
      };
      element('action').addEventListener('click', act);
      element('replay').addEventListener('click', reset);
      canvas.addEventListener('pointermove', event => {
        if (reducedMotion || state === 'playing') return;
        const rectangle = canvas.getBoundingClientRect();
        pointer.x = clamp((event.clientX - rectangle.left) / rectangle.width * 2 - 1, -1, 1);
        pointer.y = clamp((event.clientY - rectangle.top) / rectangle.height * 2 - 1, -1, 1); draw();
      });
      canvas.addEventListener('pointerleave', () => { pointer.x = 0; pointer.y = 0; draw(); });
      element('install-path').addEventListener('input', () => { element('install-path').removeAttribute('aria-invalid'); element('install-path').title = ''; });
      element('install-path').addEventListener('keydown', event => { if (event.key === 'Enter' && phase === 'welcome') { event.preventDefault(); startPreview(); } });
      preference.addEventListener('change', event => { reducedMotion = event.matches; pointer.x = 0; pointer.y = 0; draw(); });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { restorePlayback = state === 'playing'; if (restorePlayback) pause(); }
        else if (restorePlayback) { restorePlayback = false; resume(); }
      });
      const observer = new ResizeObserver(resize); observer.observe(stage);
      window.addEventListener('pagehide', () => { destroyed = true; stopFrame(); observer.disconnect(); pieces.length = 0; });
      window.supercodeInstallerPreview = Object.freeze({
        replay: startPreview, start: startPreview, reset, pause, resume,
        setProgress(value) {
          const number = Number(value);
          if (!ready || destroyed || !Number.isFinite(number)) return false;
          if (phase === 'welcome') installationPath = element('install-path').value.trim();
          stopFrame(); restorePlayback = false; progress = clamp(number / 100); elapsed = progress * duration;
          phase = progress >= 1 ? 'complete' : 'installing';
          state = progress >= 1 ? 'complete' : 'paused'; updateControls(); draw(); return true;
        },
        getState: () => ({ phase, state, progress: percentage(), reducedMotion, pieceCount: pieces.length, pendingFrames: frame === null ? 0 : 1 }),
      });
      image.onload = () => { if (destroyed) return; ready = true; buildPieces(); resize(); reset(); };
      image.onerror = () => { state = 'failed'; updateControls(); element('action').disabled = true; element('replay').disabled = true; element('status').textContent = '图标加载失败。'; };
      image.src = logoData;
    })();
  </script>
</body>
</html>
